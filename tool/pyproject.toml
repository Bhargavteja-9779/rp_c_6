[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "covercheck"
version = "0.1.0"
description = "Check, fix and report conformal prediction coverage for new cases in tabular data with repeated rows"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.22", "pandas>=1.5", "scipy>=1.8", "scikit-learn>=1.2"]
optional-dependencies = {lgbm = ["lightgbm>=3.3"], parquet = ["pyarrow"]}

[project.scripts]
covercheck = "covercheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
